<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect
      // Encode the path into the URL fragment (hash), which is preserved
      // through the redirect. index.html will restore it before Vue Router loads.
      var path = location.pathname + location.search;
      location.replace('/#' + path);
    </script>
  </head>
  <body>
  </body>
</html>
